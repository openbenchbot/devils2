name: Supply chain dependency check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-check:
    name: Dependency lockfile check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exactly the committed lockfile without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify application dependency loads
        run: node -e "const p=require('next/package.json'); if(!p.version) process.exit(1); console.log('Next.js', p.version)"
      - name: Leave time to observe the cron waiting for CI
        if: github.event_name == 'pull_request'
        run: sleep 90
